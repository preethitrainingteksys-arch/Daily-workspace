<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
    <h2>ToDo App</h2>

   <input type="text" onkeypress="return event.key !== '-'" onkeyup="validate(event)" id="todo-input" placeholder="Enter Task...">

    <input type="time" id="time-input">
    <input type="datetime-local" value="2026-03-15T19:30">
    
    
    <div class="input-group">
        <label for="priority">Choose a priority:</label>

        <select id="priority">
        <option value="high">High Priority</option>
        <option value="medium">Medium Priority</option>
        <option value="low">Low Priority</option>
         </select>
    </div>

    <button onclick="addTodo()">Add</button>
    <button onclick="sortTodo()">Sort</button>
    <div class="error" id="error">Name is Mandatory</div>
    <div class="lists">
        <div>
            <p class="title">High Priority</p>
            <ul id="high-list"></ul>
        </div>
        <div>
            <p class="title">Medium Priority</p>
            <ul id="medium-list"></ul>
        </div>
        <div>
            <p class="title">Low Priority</p>
            <ul id="low-list"></ul>
        </div>
    </div>

  
</div>

<script src="app.js"></script>
</body>
</html>
